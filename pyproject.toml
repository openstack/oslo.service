[build-system]
requires = ["pbr>=6.1.1"]
build-backend = "pbr.build"

[project]
name = "oslo.service"
description = "oslo.service library"
readme = "README.rst"
authors = [
    {name = "OpenStack", email = "openstack-discuss@lists.openstack.org"},
]
license = "Apache-2.0"
requires-python = ">=3.11"
dynamic = ["version", "dependencies"]
classifiers = [
    "Environment :: OpenStack",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://docs.openstack.org/oslo.service"
Repository = "https://opendev.org/openstack/oslo.service"

[project.optional-dependencies]
threading = [
    "cotyledon>=2.2.0",  # Apache-2.0
    "futurist>=3.1.1",  # Apache-2.0
]

[project.entry-points."oslo.config.opts"]
"oslo.service.periodic_task" = "oslo_service.periodic_task:list_opts"
"oslo.service.service" = "oslo_service.service:list_opts"
"oslo.service.sslutils" = "oslo_service.sslutils:list_opts"
"oslo.service.wsgi" = "oslo_service.wsgi:list_opts"

[tool.setuptools.packages.find]
include = ["oslo_service*"]

[tool.coverage.run]
source = [
    "oslo_service"
]
branch = true
parallel = true
omit = [
    "oslo_service/tests/*"
]

[tool.coverage.report]
ignore_errors = true
show_missing = true

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "preserve"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "G", "LOG", "S", "UP"]
external = ["H"]
ignore = [
    "S101",  # asserts are only used for type narrowing
]

[tool.ruff.lint.per-file-ignores]
"oslo_service/tests/*" = ["S"]
