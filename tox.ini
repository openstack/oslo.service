[tox]
minversion = 4.28.0
envlist = py3,pep8

[testenv]
setenv =
  PYTHONDONTWRITEBYTECODE=1
constraints =
  {env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/master}
deps =
  -r{toxinidir}/test-requirements.txt
extras =
  threading
  eventlet
commands =
  stestr run --slowest {posargs}

[testenv:py3{11,12,13,14,15}-threading]
description = Run tests with the native threading backend, without eventlet
setenv =
  {[testenv]setenv}
  OSLO_SERVICE_SKIP_EVENTLET=1
deps =
  {[testenv]deps}
extras =
  threading
commands =
  stestr run --slowest {posargs}
# Run shared tests without installing or monkey-patching eventlet. Tests
# requiring eventlet-specific APIs are skipped individually where possible.

[testenv:cover]
setenv =
  {[testenv]setenv}
  PYTHON=coverage run
deps =
  {[testenv]deps}
  coverage>=5.0 # Apache-2.0
commands =
  coverage erase
  {[testenv]commands}
  coverage combine
  coverage html -d cover
  coverage xml -o cover/coverage.xml
  coverage report

[testenv:venv]
commands = {posargs}

[testenv:docs]
allowlist_externals =
  rm
deps =
  -r{toxinidir}/doc/requirements.txt
  fixtures>=3.0.0 # Apache-2.0/BSD
extras =
  threading
  eventlet
commands =
  rm -rf doc/build
  sphinx-build -W --keep-going -b html doc/source doc/build/html {posargs}

[testenv:releasenotes]
skip_install = true
allowlist_externals =
  rm
deps =
  -r{toxinidir}/doc/requirements.txt
extras =
commands =
  rm -rf releasenotes/build
  sphinx-build -a -E -W -d releasenotes/build/doctrees --keep-going -b html releasenotes/source releasenotes/build/html

[testenv:debug]
commands = oslo_debug_helper -t oslo_service/tests {posargs}

[testenv:pep8]
description =
  Run style checks.
deps =
  pre-commit
extras =
commands =
  pre-commit run -a

[flake8]
show-source = True
# We only enable the hacking (H) checks
select = H
# H904: Delay string interpolations at logging calls
enable-extensions = H904
# H301 ruff will put commas after imports that can't fit on one line
ignore = H301
exclude = .venv,.git,.tox,dist,doc,*lib/python*,*egg,build

[hacking]
import_exceptions = oslo_service._i18n
